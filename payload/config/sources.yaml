# Source list. Every feed_url below is a CANDIDATE from public knowledge,
# not a verified fact. Run  scripts/probe_sources.py  from this machine to
# see which ones really work, are allowed by robots.txt, and are fresh.
# feed_url: null means "no official feed known" - the probe will try to
# discover one from the homepage instead of guessing.
#
# kind: company | research | industry
# reliability: 1 (weak) .. 5 (primary source), used later by ranking.

sources:
  # ---- company announcements ----
